# 终端交互（TUI）profile：基于 dsh-base 的持久化 REPL。
# 不启动 Host、HTTP 服务或 Web runtime；agent 直接在当前进程内运行，
# 读取 stdin、写入 stdout。会话复用 DSH 的 JSONL 存储，因此可通过
# `--resume` 恢复历史会话。

- id: system-prompt
  config:
    persona: >-
      You are a coding agent powered by the {{model}} model. Your working directory is {{cwd}}.
      The user talks to you through an interactive terminal; answer directly and concisely.

# 终端 REPL 不需要模块热重载；开启后还可能干扰 readline / TTY 状态。
- id: hmr
  disabled: true

- id: tools
  config:
    # 与 Web 侧保持一致：通过进程环境变量临时启用 Code Mode。
    mode: !!js process.env.DSH_TOOLS_MODE

- insert:
    # Code Mode 是核心执行能力，不依赖 Web 组件。
    - id: code-runtime
      name: '@deepseek-ai/dsh-code-runtime-worker-thread'

    # 解析 `--new/--resume/--list`，并发布 tuiStartup 服务。
    - id: tui-startup
      name: ./tui-startup.mjs
      inject: [cmdlineArgs]

    # 交互驱动：创建/恢复 Agent，并运行 REPL。
    - id: tui-runner
      name: ./tui-runner.mjs
      inject: [tuiStartup, agentDefaultModel, agents, llm, sessions]
