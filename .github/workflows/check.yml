name: Check

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run checks
        run: npm run check

      - name: Smoke-test profile composition
        run: |
          smoke_home="$(mktemp -d)"
          mkdir -p "$smoke_home/.dsh/profiles"
          ln -s "$GITHUB_WORKSPACE" "$smoke_home/.dsh/profiles/cli"
          timeout 30s env HOME="$smoke_home" npx --no-install dsh --profile cli --help
          # Known launcher race (rc.6/rc.7): --list prints the session list then
          # intermittently hangs before exiting (deterministic on Linux/inotify,
          # intermittent on macOS/kqueue). The output is the contract we test
          # here; timeout 30s reaps the process, so a hang is a known issue
          # (see CHANGELOG Known issues), not a CI failure.
          list_out="$(timeout 30s env HOME="$smoke_home" npx --no-install dsh --profile cli --list 2>&1 || true)"
          echo "$list_out"
          grep -q "no persisted sessions" <<<"$list_out" \
            || grep -qE '^[[:space:]]*[0-9a-fA-F-]{8,}' <<<"$list_out" \
            || { echo "::error::dsh --list produced unexpected output"; exit 1; }
          timeout 30s env HOME="$smoke_home" npx --no-install dsh --profile cli --dump-config
