name: Check

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run checks
        run: npm run check

      - name: Smoke-test profile composition
        run: |
          smoke_home="$(mktemp -d)"
          mkdir -p "$smoke_home/.dsh/profiles"
          ln -s "$GITHUB_WORKSPACE" "$smoke_home/.dsh/profiles/tui"
          timeout 30s env HOME="$smoke_home" npx --no-install dsh --profile tui --help
          timeout 30s env HOME="$smoke_home" npx --no-install dsh --profile tui --list
          timeout 30s env HOME="$smoke_home" npx --no-install dsh --profile tui --dump-config
